backend:
  name: github
  repo: zionhong5875-ai/KEEP-Website
  branch: edgeone-preview
  site_domain: vinnercare.com
  base_url: https://vinnercare.com
  auth_endpoint: oauth
  commit_messages:
    create: "CMS: create {{collection}} {{slug}}"
    update: "CMS: update {{collection}} {{slug}}"
    delete: "CMS: delete {{collection}} {{slug}}"
    uploadMedia: "CMS: upload {{path}}"
    deleteMedia: "CMS: delete {{path}}"

media_folder: public/assets/uploads
public_folder: /assets/uploads
publish_mode: simple

i18n_text: &i18n_text
  widget: object
  fields:
    - { label: 中文, name: zh, widget: string }
    - { label: English, name: en, widget: string }

i18n_textarea: &i18n_textarea
  widget: object
  fields:
    - { label: 中文, name: zh, widget: text }
    - { label: English, name: en, widget: text }

i18n_markdown: &i18n_markdown
  widget: object
  fields:
    - { label: 中文, name: zh, widget: markdown, minimal: true }
    - { label: English, name: en, widget: markdown, minimal: true }

seo_fields: &seo_fields
  widget: object
  fields:
    - { label: 页面标题, name: title, <<: *i18n_text }
    - { label: 页面描述, name: description, <<: *i18n_textarea }

hero_fields: &hero_fields
  widget: object
  fields:
    - { label: 小标题, name: eyebrow, <<: *i18n_text }
    - { label: 大标题, name: title, <<: *i18n_markdown }
    - { label: 说明文字, name: body, <<: *i18n_markdown }
    - { label: 图片, name: image, widget: image, required: false }
    - { label: 图片描述 Alt, name: alt, widget: string, required: false }
    - { label: 深色文字模式, name: light, widget: boolean, required: false }
    - label: 首页轮播图（仅首页使用）
      name: slides
      widget: list
      required: false
      collapsed: true
      summary: "{{fields.eyebrow.zh}}"
      fields:
        - { label: 小标题, name: eyebrow, <<: *i18n_text }
        - { label: 大标题, name: title, <<: *i18n_markdown }
        - { label: 说明文字, name: body, <<: *i18n_markdown }
        - { label: 图片, name: image, widget: image }
        - { label: 图片描述 Alt, name: alt, widget: string }
        - { label: 深色文字模式, name: light, widget: boolean, required: false }

metric_fields: &metric_fields
  widget: object
  fields:
    - { label: 数字, name: number, <<: *i18n_text }
    - { label: 说明, name: label, <<: *i18n_text }

partner_fields: &partner_fields
  widget: object
  fields:
    - { label: 名称, name: name, widget: string }
    - { label: Logo, name: logo, widget: image }

bilingual_paragraphs: &bilingual_paragraphs
  widget: list
  required: false
  fields:
    - { label: 中文, name: zh, widget: text }
    - { label: English, name: en, widget: text }

bilingual_bullets: &bilingual_bullets
  widget: list
  required: false
  fields:
    - { label: 中文, name: zh, widget: text }
    - { label: English, name: en, widget: text }

article_media: &article_media
  widget: list
  required: false
  collapsed: true
  summary: "{{fields.caption.zh}}"
  fields:
    - { label: 图片, name: image, widget: image }
    - { label: 图片描述 Alt, name: alt, <<: *i18n_text }
    - { label: 图片说明, name: caption, <<: *i18n_text }
    - label: 图片来源
      name: source
      widget: object
      required: false
      fields:
        - { label: 来源链接, name: url, widget: string }
        - { label: 来源名称, name: label, <<: *i18n_text }

article_table: &article_table
  widget: object
  required: false
  fields:
    - { label: 表格注释, name: caption, <<: *i18n_text }
    - label: 表头
      name: headers
      widget: list
      fields:
        - { label: 中文, name: zh, widget: string }
        - { label: English, name: en, widget: string }
    - label: 表格行
      name: rows
      widget: list
      field:
        label: 一行
        name: row
        widget: list
        field:
          label: 单元格
          name: cell
          widget: object
          fields:
            - { label: 中文, name: zh, widget: text }
            - { label: English, name: en, widget: text }

article_page_window: &article_page_window
  widget: object
  required: false
  fields:
    - { label: 页面链接, name: href, widget: string }
    - { label: 图片, name: image, widget: image }
    - { label: 图片描述 Alt, name: alt, <<: *i18n_text }
    - { label: 小标题, name: kicker, <<: *i18n_text }
    - { label: 标题, name: title, <<: *i18n_text }
    - { label: 说明, name: body, <<: *i18n_textarea }
    - { label: 链接文案, name: link, <<: *i18n_text }

article_section_field_definitions: &article_section_field_definitions
  - { label: 标题层级（1/2/3）, name: level, widget: number, required: false, value_type: int }
  - { label: 小标题, name: heading, <<: *i18n_text, required: false }
  - { label: 正文, name: body, <<: *i18n_textarea, required: false }
  - label: 正文段落
    name: paragraphs
    <<: *bilingual_paragraphs
  - label: 要点列表
    name: bullets
    <<: *bilingual_bullets
  - label: 段落图片
    name: media
    <<: *article_media
  - label: 表格
    name: table
    <<: *article_table
  - label: 表后段落
    name: paragraphsAfter
    <<: *bilingual_paragraphs
  - label: 相关页面窗口
    name: pageWindow
    <<: *article_page_window
  - label: 文中链接段落
    name: linkedParagraph
    widget: object
    required: false
    fields:
      - { label: 跳转链接, name: href, widget: string }
      - { label: 链接文字, name: text, <<: *i18n_textarea }
  - { label: 关联产品线 Slug, name: productLineSlug, widget: string, required: false }
  - { label: 关联产品 Slug, name: productSlug, widget: string, required: false }
  - label: 子章节
    name: subsections
    widget: list
    required: false
    fields:
      - { label: 小标题, name: heading, <<: *i18n_text }
      - { label: 正文, name: body, <<: *i18n_textarea, required: false }
      - label: 正文段落
        name: paragraphs
        <<: *bilingual_paragraphs
      - label: 要点列表
        name: bullets
        <<: *bilingual_bullets
      - label: 后续段落
        name: paragraphsAfter
        <<: *bilingual_paragraphs

article_section_fields: &article_section_fields
  widget: object
  fields: *article_section_field_definitions

policy_fields: &policy_fields
  widget: object
  fields:
    - { label: 页面栏目, name: eyebrow, <<: *i18n_text }
    - { label: 标题, name: title, <<: *i18n_text }
    - { label: 摘要, name: summary, <<: *i18n_textarea }
    - { label: 更新日期, name: updatedAt, widget: string }
    - { label: 生效日期, name: effectiveAt, widget: string }
    - label: 正文段落
      name: body
      widget: list
      summary: "{{fields.heading.zh}}"
      fields:
        - { label: 小标题, name: heading, <<: *i18n_text }
        - label: 正文段落
          name: paragraphs
          <<: *bilingual_paragraphs
        - label: 要点列表
          name: items
          <<: *bilingual_bullets

collections:
  - name: site
    label: 官网内容
    files:
      - label: 全站设置
        name: siteSettings
        file: src/data/site/siteSettings.json
        format: json
        fields:
          - label: 品牌
            name: brand
            widget: object
            fields:
              - { label: 品牌名, name: name, widget: string }
              - { label: Logo, name: logo, widget: image }
              - { label: Logo Alt, name: logoAlt, widget: string }
          - label: 顶部导航文案
            name: navigation
            widget: object
            fields:
              - { label: 首页, name: home, <<: *i18n_text }
              - { label: 产品, name: products, <<: *i18n_text }
              - { label: 关于维尼, name: about, <<: *i18n_text }
              - { label: 工厂介绍, name: factory, <<: *i18n_text }
              - { label: 工厂资质, name: factoryQualification, <<: *i18n_text }
              - { label: 联系, name: contact, <<: *i18n_text }
              - { label: 博客与资源, name: resources, <<: *i18n_text }
          - label: 页脚
            name: footer
            widget: object
            fields:
              - { label: 页脚小标题, name: kicker, <<: *i18n_text }
              - { label: 产品列标题, name: products, <<: *i18n_text }
              - { label: 资源列标题, name: resources, <<: *i18n_text }
              - { label: 资料下载链接, name: downloads, <<: *i18n_text }
              - { label: 联系列标题, name: contact, <<: *i18n_text }
              - { label: 政策列标题, name: policies, <<: *i18n_text }
              - { label: 关注我们标题, name: follow, <<: *i18n_text }
              - { label: 微信标题, name: wechatTitle, <<: *i18n_text }
              - { label: 微信二维码, name: wechatQr, widget: image }
              - { label: 微信二维码 Alt, name: wechatAlt, widget: string }
              - { label: 微信说明, name: wechatText, <<: *i18n_text }
              - { label: 版权行, name: copyright, widget: string }
              - { label: 公司信息, name: company, <<: *i18n_text }
              - label: 社媒链接
                name: socials
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: 跳转链接, name: href, widget: string }
                  - { label: Icon, name: icon, widget: image }
              - label: 政策链接
                name: legal
                widget: list
                summary: "{{fields.zh}}"
                fields:
                  - { label: 链接, name: href, widget: string }
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }

      - label: 首页
        name: home
        file: src/data/site/home.json
        format: json
        fields:
          - { label: SEO, name: meta, <<: *seo_fields }
          - { label: 首屏 Banner, name: hero, <<: *hero_fields }
          - label: 公司介绍模块
            name: company
            widget: object
            fields:
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_text }
              - label: 段落
                name: paragraphs
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
              - label: 总部与制造基地介绍
                name: locations
                widget: list
                summary: "{{fields.title.zh}}"
                fields:
                  - { label: 标题, name: title, <<: *i18n_textarea }
                  - label: 介绍段落
                    name: paragraphs
                    <<: *bilingual_paragraphs
              - { label: YouTube Embed 地址, name: videoSrc, widget: string }
              - { label: 视频标题, name: videoTitle, widget: string }
              - label: 公司数字
                name: stats
                widget: list
                summary: "{{fields.number.zh}} {{fields.body.zh}}"
                fields:
                  - { label: Icon Key, name: icon, widget: string, hint: "clock / capacity" }
                  - { label: 分组标题, name: label, <<: *i18n_text }
                  - { label: 数字, name: number, <<: *i18n_text }
                  - { label: 说明, name: body, <<: *i18n_text }
          - label: 产品线模块
            name: productLinesSection
            widget: object
            fields:
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_text }
              - { label: 按钮文字, name: cta, <<: *i18n_text }
          - label: 研发基因模块
            name: rd
            widget: object
            fields:
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_text }
              - { label: 说明, name: body, <<: *i18n_textarea }
              - label: 研发数字
                name: metrics
                widget: list
                summary: "{{fields.number.zh}} {{fields.body.zh}}"
                fields:
                  - { label: Icon Key, name: icon, widget: string, hint: "investment / formula / network / patent / lab" }
                  - { label: 数字, name: number, <<: *i18n_text }
                  - { label: 说明, name: body, <<: *i18n_text }
          - label: 新闻与博客模块标题
            name: insights
            widget: object
            fields:
              - label: 新闻
                name: news
                widget: object
                fields:
                  - { label: 小标题, name: kicker, <<: *i18n_text }
                  - { label: 标题, name: title, <<: *i18n_text }
              - label: 博客
                name: blog
                widget: object
                fields:
                  - { label: 小标题, name: kicker, <<: *i18n_text }
                  - { label: 标题, name: title, <<: *i18n_text }
          - label: 合作伙伴与采购方模块
            name: partners
            widget: object
            fields:
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_text }
              - label: 合作伙伴与采购方
                name: items
                widget: list
                summary: "{{fields.name}}"
                fields:
                  - { label: 名称, name: name, widget: string }
                  - { label: Logo, name: logo, widget: image }
          - label: 旧版首页简介（保留兼容）
            name: intro
            widget: object
            required: false
            collapsed: true
            fields:
              - { label: 小标题, name: kicker, <<: *i18n_text, required: false }
              - { label: 标题, name: title, <<: *i18n_text, required: false }
          - label: 旧版产品线模块（保留兼容）
            name: lines
            widget: list
            required: false
            collapsed: true
            fields:
              - { label: 序号, name: index, widget: string, required: false }
              - { label: 双语序号, name: indexLabel, <<: *i18n_text, required: false }
              - { label: 产品线名称, name: name, <<: *i18n_text, required: false }
              - { label: 副标题, name: title, <<: *i18n_text, required: false }
              - { label: 深色模块, name: dark, widget: boolean, required: false }
              - { label: 图片, name: image, widget: image, required: false }
              - { label: 图片描述 Alt, name: alt, widget: string, required: false }
              - { label: 说明文字, name: body, <<: *i18n_textarea, required: false }
          - label: 旧版轮播场景（保留兼容）
            name: gallery
            widget: list
            required: false
            collapsed: true
            fields:
              - { label: 图片, name: image, widget: image, required: false }
              - { label: 图片描述 Alt, name: alt, widget: string, required: false }
              - { label: 标题, name: caption, <<: *i18n_text, required: false }

      - label: 产品与 SKU
        name: products
        file: src/data/site/products.json
        format: json
        fields:
          - { label: SEO, name: meta, <<: *seo_fields }
          - { label: 首屏, name: hero, <<: *hero_fields }
          - label: 产品线与 SKU
            name: lines
            widget: list
            summary: "{{fields.index}} {{fields.brand}}"
            fields:
              - { label: 序号, name: index, widget: string }
              - { label: 双语序号, name: indexLabel, <<: *i18n_text }
              - { label: 产品线短名称, name: name, <<: *i18n_text }
              - { label: URL Slug, name: slug, widget: string }
              - { label: 品牌显示名, name: brand, widget: string }
              - { label: 系列标题, name: title, <<: *i18n_text }
              - { label: 产品页摘要, name: summary, <<: *i18n_textarea }
              - { label: 包含产品, name: products, <<: *i18n_textarea }
              - { label: 系列页详细介绍, name: detail, <<: *i18n_textarea }
              - { label: 系列主图, name: image, widget: image }
              - { label: 系列主图 Alt, name: alt, widget: string }
              - label: 适用场景
                name: uses
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: string }
                  - { label: English, name: en, widget: string }
              - { label: 单 SKU 版式, name: single, widget: boolean, required: false }
              - label: SKU
                name: skus
                widget: list
                required: false
                summary: "{{fields.code}} {{fields.title}}"
                fields:
                  - { label: URL Slug, name: slug, widget: string }
                  - { label: SKU 编号, name: code, widget: string }
                  - { label: 货号, name: itemNo, widget: string, required: false }
                  - { label: SKU 名称, name: title, widget: string }
                  - { label: 计划中产品（不生成详情页）, name: comingSoon, widget: boolean, required: false, default: false }
                  - { label: 双语展示名称, name: displayName, <<: *i18n_text, required: false }
                  - { label: 产品分组, name: group, <<: *i18n_text, required: false }
                  - { label: 卡片标签, name: cardLabel, <<: *i18n_text, required: false }
                  - { label: 主图, name: image, widget: image }
                  - { label: 主图 Alt, name: alt, widget: string }
                  - { label: 列表摘要, name: body, <<: *i18n_textarea }
                  - { label: 详情页简介, name: intro, <<: *i18n_textarea }
                  - label: 详情页轮播图
                    name: gallery
                    widget: list
                    summary: "{{fields.alt}}"
                    fields:
                      - { label: 图片, name: image, widget: image }
                      - { label: 图片描述 Alt, name: alt, widget: string }
                  - label: 卖点
                    name: highlights
                    widget: list
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - label: 产品特点（计划中产品卡片）
                    name: features
                    widget: list
                    required: false
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - label: 适用场景（计划中产品卡片）
                    name: applications
                    widget: list
                    required: false
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - label: 杀菌/抗菌性能（感染控制产品使用）
                    name: killPerformance
                    widget: list
                    required: false
                    fields:
                      - { label: 指标名, name: label, <<: *i18n_text }
                      - { label: 指标内容, name: value, <<: *i18n_text }
                  - label: 使用说明
                    name: usage
                    widget: list
                    required: false
                    fields:
                      - { label: 中文, name: zh, widget: string }
                      - { label: English, name: en, widget: string }
                  - label: 规格参数
                    name: specs
                    widget: list
                    fields:
                      - { label: 参数名, name: label, <<: *i18n_text }
                      - { label: 参数值, name: value, <<: *i18n_text }
                  - label: 下载资源
                    name: downloads
                    widget: list
                    required: false
                    fields:
                      - { label: 类型, name: type, widget: string }
                      - { label: 标题, name: title, <<: *i18n_text }
                      - { label: 上传文件, name: href, widget: file, required: false }

      - label: 关于维尼
        name: aboutVinner
        file: src/data/site/aboutVinner.json
        format: json
        fields:
          - { label: SEO, name: meta, <<: *seo_fields }
          - { label: 首屏, name: hero, <<: *hero_fields }
          - label: 总部介绍
            name: headquartersSection
            widget: object
            fields:
              - { label: 图片, name: image, widget: image }
              - { label: 图片描述 Alt, name: imageAlt, widget: string }
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_text }
              - label: 段落
                name: paragraphs
                <<: *bilingual_paragraphs
          - label: 制造基地介绍
            name: facilitySection
            widget: object
            fields:
              - { label: 图片, name: image, widget: image }
              - { label: 图片描述 Alt, name: imageAlt, widget: string }
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_text }
              - label: 段落
                name: paragraphs
                <<: *bilingual_paragraphs
          - label: 工厂区域模块
            name: factoryAreasSection
            widget: object
            fields:
              - label: 制造现场
                name: production
                widget: object
                fields:
                  - { label: 小标题, name: kicker, <<: *i18n_text }
                  - { label: 标题, name: title, <<: *i18n_text }
              - label: 质量与交付
                name: support
                widget: object
                fields:
                  - { label: 小标题, name: kicker, <<: *i18n_text }
                  - { label: 标题, name: title, <<: *i18n_text }
          - label: 主营业务与产品矩阵
            name: businessSection
            widget: object
            fields:
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_text }
              - { label: 按钮文案, name: cta, <<: *i18n_text }
              - label: 业务与产品线
                name: items
                widget: list
                fields:
                  - { label: 产品线 Slug, name: lineSlug, widget: string }
                  - { label: 标题, name: title, <<: *i18n_text }
                  - { label: 说明, name: body, <<: *i18n_textarea }
          - label: 公司介绍
            name: intro
            widget: object
            fields:
              - { label: 小标题, name: kicker, <<: *i18n_text }
              - { label: 标题, name: title, <<: *i18n_textarea }
              - label: 段落
                name: paragraphs
                widget: list
                fields:
                  - { label: 中文, name: zh, widget: text }
                  - { label: English, name: en, widget: text }
          - label: 关键数字
            name: metricsSection
            widget: object
            fields:
